<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Set a new password | FuturesForged</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth/auth.css">
</head>
<body>
<nav><div class="nav-inner"><a class="logo" href="/">FUTURES<span>FORGED</span></a></div></nav>
<main>
<h1>Set a new password</h1>
<div class="card">
<form id="form" novalidate>
<label for="password">NEW PASSWORD (8+ CHARACTERS)</label>
<input id="password" type="password" autocomplete="new-password" minlength="8" required>
<label for="password2">NEW PASSWORD AGAIN</label>
<input id="password2" type="password" autocomplete="new-password" minlength="8" required>
<button id="submit" type="submit">SET PASSWORD</button>
</form>
<p id="msg" class="msg" role="status" aria-live="polite" hidden></p>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="/auth/ff-auth.js"></script>
<script>FFAuth.boot("update-password");</script>
</body>
</html>
