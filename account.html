<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Your account | FuturesForged</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth/auth.css">
</head>
<body>
<nav><div class="nav-inner"><a class="logo" href="/">FUTURES<span>FORGED</span></a></div></nav>
<main>
<h1>Your account</h1>
<div class="card">
<div class="row"><span>EMAIL</span><span id="acct-email"></span></div>
<div class="row"><span>PLAN</span><span id="acct-plan">Loading&hellip;</span></div>
<div class="row"><span>LICENCE KEY</span><span id="acct-key" class="key"></span></div>
<div class="links"><button id="key-show" type="button" class="ghost" hidden>Show</button><button id="key-copy" type="button" class="ghost" hidden>Copy</button></div>
<div id="buy" hidden>
<a id="buy-0" class="btn" rel="noopener"></a>
<a id="buy-1" class="btn ghost" rel="noopener"></a>
<p class="small">Secure checkout by Stripe. Your licence is activated on this account when the payment completes.</p>
</div>
<a id="manage" class="btn ghost" rel="noopener" hidden>MANAGE PLAN</a>
<a id="download" class="btn ghost" rel="noopener">DOWNLOAD FUTURESFORGED</a>
<button id="signout" type="button" class="ghost">SIGN OUT</button>
<p id="msg" class="msg" role="status" aria-live="polite" hidden></p>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="/auth/ff-auth.js"></script>
<script>FFAuth.boot("account");</script>
</body>
</html>
